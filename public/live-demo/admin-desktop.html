    <title>Minka admin desktop demo</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f2ea;
        --ink: #17231f;
        --toast: #0d332b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .demo-stage {
        position: fixed;
        top: 0;
        left: 0;
        width: 1410px;
        height: 911px;
        overflow: hidden;
        transform-origin: top left;
        background: var(--paper);
        box-shadow: 0 22px 70px rgba(23, 35, 31, 0.12);
      }

      .demo-screen {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }

      .hotspot-layer {
        position: absolute;
        inset: 0;
        z-index: 3;
      }

      .hotspot {
        position: absolute;
        display: block;
        padding: 0;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: transparent;
        cursor: pointer;
      }

      .hotspot:focus-visible {
        outline: 4px solid rgba(31, 119, 102, 0.5);
        outline-offset: 2px;
        background: rgba(31, 119, 102, 0.08);
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 10;
        max-width: min(420px, calc(100vw - 36px));
        padding: 12px 16px;
        border-radius: 999px;
        background: var(--toast);
        color: #fffaf2;
        box-shadow: 0 18px 42px rgba(13, 51, 43, 0.24);
        font-size: 14px;
        font-weight: 750;
        line-height: 1.3;
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .toast[data-visible="true"] {
        opacity: 1;
        transform: translateY(0);
      }

      @media (prefers-reduced-motion: reduce) {
        .toast {
          transition: none;
        }
      }
    </style>
  </head>

        function layoutStage() {
          const scale = Math.max(
            window.innerWidth / SCREEN_WIDTH,
            window.innerHeight / SCREEN_HEIGHT,
          );
          const x = (window.innerWidth - SCREEN_WIDTH * scale) / 2;
          const y = (window.innerHeight - SCREEN_HEIGHT * scale) / 2;
          stage.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
        }

        function showToast(message = DEMO_MESSAGE) {
          window.clearTimeout(toastTimer);
          toast.textContent = message;
          toast.dataset.visible = "true";
          toastTimer = window.setTimeout(() => {
            toast.dataset.visible = "false";
          }, 2400);
        }

        function mapSourceX(x) {
          let mappedX = x;
          let removedWidth = 0;

          for (const cut of HORIZONTAL_CUTS) {
            if (x >= cut.end) {
              mappedX -= cut.width;
              removedWidth += cut.width;
              continue;
            }

            if (x > cut.start) {
              mappedX = cut.start - removedWidth;
              break;
            }
          }

          return Math.max(0, Math.min(SCREEN_WIDTH, mappedX));
        }

        function mapHotspot(item) {
          const x = mapSourceX(item.x);
          const right = mapSourceX(item.x + item.width);

          return {
            x,
            y: item.y,
            width: Math.max(8, right - x),
            height: item.height,
          };
        }

        function buildHotspots(screen) {
          hotspotLayer.replaceChildren();
          const activeHotspots = screen.modal
            ? screen.hotspots || []
            : [...navHotspots, ...(screen.hotspots || [])];

          activeHotspots.forEach((item) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "hotspot";
            button.setAttribute("aria-label", item.label);
            button.title = item.label;
            const bounds = mapHotspot(item);
            button.style.left = `${bounds.x}px`;
            button.style.top = `${bounds.y}px`;
            button.style.width = `${bounds.width}px`;
            button.style.height = `${bounds.height}px`;
            button.addEventListener("click", () => {
              if (item.target) {
                setScreen(item.target);
                return;
              }
              showToast(item.message);
            });
            hotspotLayer.append(button);
          });
        }

        function setScreen(id, updateHash = true) {
          const nextScreen = screens[id] || screens["dashboard-a"];
          currentScreenId = screens[id] ? id : "dashboard-a";
          screenImage.src = `${ASSET_ROOT}${nextScreen.image}`;
          buildHotspots(nextScreen);

          if (updateHash) {
            window.history.replaceState(null, "", `#${currentScreenId}`);
          }
        }

        function moveByScroll(direction) {
          const current = screens[currentScreenId];
          const target = direction > 0 ? current.next : current.prev;
          if (target) {
            setScreen(target);
          }
        }

        window.addEventListener("resize", layoutStage);

        window.addEventListener(
          "wheel",
          (event) => {
            if (Math.abs(event.deltaY) < 24 || Math.abs(event.deltaY) < Math.abs(event.deltaX)) {
              return;
            }

            event.preventDefault();
            const now = Date.now();
            if (now - lastScrollAt < 420) return;
            lastScrollAt = now;
            moveByScroll(event.deltaY);
          },
          { passive: false },
        );

        stage.addEventListener(
          "touchstart",
          (event) => {
            touchStartY = event.changedTouches[0]?.clientY ?? null;
          },
          { passive: true },
        );

        stage.addEventListener(
          "touchend",
          (event) => {
            if (touchStartY === null) return;
            const endY = event.changedTouches[0]?.clientY ?? touchStartY;
            const deltaY = touchStartY - endY;
            touchStartY = null;
            if (Math.abs(deltaY) > 44) moveByScroll(deltaY);
          },
          { passive: true },
        );

        window.addEventListener("keydown", (event) => {
          const current = screens[currentScreenId];
          if (event.key === "Escape" && current.closeTarget) {
            event.preventDefault();
            setScreen(current.closeTarget);
          }
          if (event.key === "ArrowDown" || event.key === "PageDown" || event.key === " ") {
            event.preventDefault();
            moveByScroll(1);
          }
          if (event.key === "ArrowUp" || event.key === "PageUp") {
            event.preventDefault();
            moveByScroll(-1);
          }
        });

        window.addEventListener("hashchange", () => {
          const requested = window.location.hash.replace("#", "");
          if (requested && screens[requested]) setScreen(requested, false);
        });

        Object.values(screens).forEach((screen) => {
          const image = new Image();
          image.src = `${ASSET_ROOT}${screen.image}`;
        });

        const initialScreen = window.location.hash.replace("#", "");
        layoutStage();
        setScreen(initialScreen && screens[initialScreen] ? initialScreen : "dashboard-a", false);
      })();
